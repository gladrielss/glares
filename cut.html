<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0B0B0A" />
<title>The Cut — Glares</title>
<link rel="preconnect" href="https://zrlrbucvnadnxsoqtgfd.supabase.co" crossorigin />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/cinema.css" />
<link rel="stylesheet" href="css/typography-overrides.css" />
</head>
<body class="cut-body">

<div class="cut-shell">
  <header class="cut-top">
    <a href="index.html#feed-section" class="cut-back" aria-label="Back to feed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg>
    </a>
    <div class="cut-titles">
      <span class="cut-eyebrow">Pass / Keep</span>
      <span class="cut-wordmark">The Cut</span>
    </div>
    <button type="button" class="cut-sound" id="cut-sound" aria-label="Mute sound" aria-pressed="true"></button>
  </header>

  <div class="cut-chips" id="cut-chips"></div>

  <div class="cut-stage" id="cut-stage">
    <p class="cut-loading" id="cut-loading">Loading the deck…</p>
  </div>

  <div class="cut-progress" aria-hidden="true"><span id="cut-progress-fill"></span></div>

  <div class="cut-actions" id="cut-actions">
    <button type="button" class="cut-act cut-act-pass" id="cut-pass" aria-label="Pass">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <button type="button" class="cut-act cut-act-undo" id="cut-undo" aria-label="Undo last" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h11a5 5 0 0 1 0 10h-3"/><path d="M6.5 5.5 3 9l3.5 3.5"/></svg>
    </button>
    <button type="button" class="cut-act cut-act-keep" id="cut-keep" aria-label="Keep"></button>
  </div>

  <p class="cut-hint" id="cut-hint">swipe left to pass &nbsp;·&nbsp; right to keep</p>
</div>

<p class="cut-live" id="cut-live" role="status" aria-live="polite"></p>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="js/supabase-client.js"></script>
<script defer src="js/icons.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/cut.js"></script>
<script defer src="js/profile-links.js"></script>
<script defer src="js/cinema.js"></script>
</body>
</html>
